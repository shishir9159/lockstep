[project]
name = "intra-gpu-reduction"
version = "0.1.0"
description = "FP4 on Hopper: emulated MXFP4 GEMMs and exact integer gradient reduction"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Linux PyPI wheels are CUDA-enabled; Windows/macOS get CPU torch, which is
    # enough for the tests. Pin a CUDA build with
    #   uv sync --index https://download.pytorch.org/whl/cu128
    "torch>=2.6",
    # Triton publishes Linux wheels only.
    "triton>=3.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["matplotlib>=3.8", "pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false                 # scripts, not an installable library

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Failed to initialize NumPy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E731"]               # lambdas as Triton grid callables are the idiom
