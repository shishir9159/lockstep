[project]
name = "intra-gpu-reduction"
version = "0.1.0"
description = "FP4 on Hopper: emulated MXFP4 GEMMs and exact integer gradient reduction"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    # Linux PyPI wheels are CUDA-enabled; Windows takes CUDA 13 wheels (sm_75+)
    # from the PyTorch index below.
    "torch>=2.6",
    # Triton publishes Linux wheels only.
    "triton>=3.0 ; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = ["matplotlib>=3.8", "pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false                 # scripts, not an installable library

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Failed to initialize NumPy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E731"]               # lambdas as Triton grid callables are the idiom
